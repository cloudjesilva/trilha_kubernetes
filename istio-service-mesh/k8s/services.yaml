apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
    version: prod
  ports:
  - port: 80
    targetPort: 3000
    name: http
  - port: 9464
    targetPort: 9464
    name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: middleware
  labels:
    app: middleware    
spec:
  selector:
    app: middleware
    version: prod
  ports:
  - port: 80
    targetPort: 3000
    name: http
  - port: 9464
    targetPort: 9464
    name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
    version: prod
  ports:
  - port: 80
    targetPort: 3000
    name: http
  - port: 9464
    targetPort: 9464
    name: prometheus